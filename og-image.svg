<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,10,10,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top red line -->
  <rect width="1200" height="3" fill="#FF0A0A"/>

  <!-- Logo bar -->
  <rect x="72" y="52" width="5" height="44" rx="2" fill="#FF0A0A"/>
  <!-- Logo text -->
  <text x="97" y="83" font-family="'Arial Black', sans-serif" font-size="26" font-weight="900" fill="white" letter-spacing="4">YORKSEED</text>

  <!-- Updated Daily badge -->
  <rect x="1054" y="52" width="146" height="34" rx="6" fill="#FF0A0A"/>
  <text x="1127" y="74" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle" letter-spacing="0.5">Updated Daily</text>

  <!-- Eyebrow -->
  <text x="72" y="188" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FF0A0A" letter-spacing="2">THE ORIGINAL VIRAL CONFERENCE SPREADSHEET — SINCE 2023</text>

  <!-- Main title line 1 -->
  <text x="72" y="278" font-family="Georgia, serif" font-size="72" font-weight="400" fill="#FF0A0A">New York Fintech Week</text>

  <!-- Main title line 2 -->
  <text x="72" y="358" font-family="Georgia, serif" font-size="72" font-weight="400" fill="white">2026 Master Side Event List</text>

  <!-- Description -->
  <text x="72" y="404" font-family="Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)">115+ events across Fintech, AI &amp; Tech, Web3, VC, and Marketing. Events you can access</text>
  <text x="72" y="426" font-family="Arial, sans-serif" font-size="17" fill="rgba(255,255,255,0.5)">without a badge — curated by Yorkseed.</text>

  <!-- Bottom tags -->
  <rect x="72" y="480" width="220" height="28" rx="4" fill="none" stroke="rgba(255,10,10,0.4)" stroke-width="1"/>
  <text x="182" y="499" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#FF0A0A" text-anchor="middle" letter-spacing="1">NEW YORK FINTECH WEEK</text>

  <rect x="304" y="480" width="100" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="354" y="499" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">AI &amp; TECH</text>

  <rect x="416" y="480" width="72" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="452" y="499" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">WEB3</text>

  <rect x="500" y="480" width="130" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="565" y="499" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">FOUNDERS &amp; VC</text>

  <rect x="642" y="480" width="112" height="28" rx="4" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="698" y="499" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">MARKETING</text>

  <!-- Stats -->
  <text x="820" y="502" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">115+</text>
  <text x="820" y="520" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">EVENTS</text>

  <rect x="893" y="476" width="1" height="40" fill="rgba(255,255,255,0.1)"/>

  <text x="910" y="502" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">Apr 20</text>
  <text x="910" y="520" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">STARTS</text>

  <rect x="1002" y="476" width="1" height="40" fill="rgba(255,255,255,0.1)"/>

  <text x="1018" y="502" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="white">May 5</text>
  <text x="1018" y="520" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">ENDS</text>

  <!-- URL bottom right -->
  <text x="1128" y="598" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.3)" text-anchor="middle">
    <tspan fill="#FF0A0A">nyftw.</tspan>yorkseed.co
  </text>
</svg>
